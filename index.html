</style></head><body><header class="top"><div class="topin"><div class="brand"><i>/</i>SLASH VISUALS</div><small>画像生成コマンド図鑑</small><label class="search"><input id="search" placeholder="例：広告、断面図、映画、光…"></label></div></header><section class="hero"><div><span class="kicker">360 COMMANDS · 108 VISUAL EXAMPLES</span><h1>欲しい表現を、<br><span>一発で探す。</span></h1><p class="lead">図解・広告・写真・3D・映像表現まで。初心者でも完成形を見ながら選び、そのままコピーして使えるスラッシュコマンド図鑑です。</p><div class="stats"><div class="stat"><b>18</b><span>カテゴリー</span></div><div class="stat"><b>360</b><span>コマンド</span></div><div class="stat"><b>1 click</b><span>コピー</span></div></div></div><div class="heroart"><img src="assets/0e2d10cc-a9cd-48e7-9e2a-1f29fb0cccd6.png" alt="香水の広告クリエイティブ"></div></section><section class="quick"><h2>カテゴリーから探す</h2><nav class="chips" id="chips"></nav></section><section class="tools"><div class="purpose"><button class="btn" data-q="商品">商品を魅力的に</button><button class="btn" data-q="仕組み">仕組みを説明</button><button class="btn" data-q="SNS">SNSで目立つ</button><button class="btn" data-q="映画">映画のように</button><button class="btn" id="favBtn">♡ お気に入り</button></div><button class="btn acid" id="mix">✦ コマンドを組み合わせる</button></section><main><div id="content"></div></main><dialog id="dialog"><button class="close" onclick="dialog.close()">×</button><div class="modal"><div class="modalpreview" id="mp"></div><div class="modalbody"><span class="cmd" id="mc"></span><h3 id="mt"></h3><p id="md"></p><div class="prompt" id="prompt"></div><button class="btn acid" id="copyPrompt">この例をコピー</button></div></div></dialog><div class="toast" id="toast">コピーしました</div><script>

const boards=[null,"02-analysis.png","03-structure.png","04-adcreative.png","05-product.png","06-brand.png","07-editorial.png","08-social.png","09-cinema.png","10-camera.png","11-light.png","12-architecture.png","13-3d.png","14-concept.png","15-surreal.png","16-material.png","17-era.png","18-motion.png"];const colors=[['#5d42f5','#17b6a5'],['#ff5f6d','#ffc371'],['#111827','#4361ee'],['#118ab2','#06d6a0'],['#8a2be2','#ff4d8d'],['#1f2937','#d4a373']];
let selected='すべて',query='',favOnly=false;const favs=new Set(JSON.parse(localStorage.getItem('sv-favs')||'[]'));
const jp=(cmd,cat)=>({title:actual[cmd]?.[1]||cmd.replace(/([A-Z])/g,' $1')+' 表現',desc:`${cat}で使える「/${cmd}」。完成イメージを指定し、画像生成の方向性を短く伝えます。`,use:`${cat}の制作、企画共有、SNS投稿、プレゼン資料におすすめ`,sample:actual[cmd]?.[1]||`${cmd}を使ったクリエイティブな完成例`});
function synthetic(cmd,i){const c=colors[i%colors.length];return `<div class="synthetic" style="--c1:${c[0]};--c2:${c[1]}"><b>${jp(cmd,'').title}</b><div class="shape">${['◫','◉','✦','⬡','↗','◎'][i%6]}</div><small>VISUAL SAMPLE · /${cmd}</small></div>`}

${ci===0?examples.map((x,i)=>`<div class="visual" onclick="openModal('${x}','${c[0]}',${i})">${visual(x,i)}<span class="tag">/${x}</span></div>`).join(''):`<div class="visual categoryboard"><img loading="lazy" src="assets/${boards[ci]}" alt="${c[0]}の6つの完成例"></div>`}
</div><div class="grid">${list.map((x,i)=>{const d=jp(x,c[0]);return `<article class="card"><div><span class="cmd">/${x}</span><div class="desc">${d.title}</div><div class="meta">${d.use}<br>例：「${d.sample}」</div></div><div class="actions"><button class="iconbtn" aria-label="コピー" onclick="copyText('/${x}')">⧉</button><button class="iconbtn" aria-label="お気に入り" onclick="toggleFav('${x}')">${favs.has(x)?'♥':'♡'}</button></div></article>`}).join('')}</div></section>`});document.getElementById('content').innerHTML=html||'<div class="empty">該当するコマンドが見つかりません。別の言葉で検索してみてください。</div>'}
function copyText(t){navigator.clipboard.writeText(t);const z=document.getElementById('toast');z.classList.add('show');setTimeout(()=>z.classList.remove('show'),1200)}function toggleFav(x){favs.has(x)?favs.delete(x):favs.add(x);localStorage.setItem('sv-favs',JSON.stringify([...favs]));render()}
function openModal(cmd,cat,i=0){const d=jp(cmd,cat);document.getElementById('mp').innerHTML=visual(cmd,i);document.getElementById('mc').textContent='/'+cmd;document.getElementById('mt').textContent=d.title;document.getElementById('md').textContent=d.desc;const p=`/${cmd} 「${d.sample}」。初心者にも意味が伝わる構成で、主役を明確にし、文字は読みやすく、余白を十分に取ってください。`;document.getElementById('prompt').textContent=p;document.getElementById('copyPrompt').onclick=()=>copyText(p);dialog.showModal()}
